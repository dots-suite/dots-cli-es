# -------------------------------------------------------------------
# Source des données (API, dépôt, corpus distant, etc.)
# -------------------------------------------------------------------
source:
  DTS_URL: "https://dev.chartes.psl.eu/dots/api/dts"  # Or local if deployed (base URL of the source API http://localhost:8080/api/dts)
  TARGET_COLLECTION: ""  # Identifiant de la collection racine à explorer empty by default
  CUSTOM_SETTINGS_PATH: !!str ${CUSTOM_SETTINGS_PATH}
