[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dots-es"
dynamic = ["version"]
description = "DoTS Elasticsearch search API and indexing CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jean-Victor Boby" }]
maintainers = [{ name = "École nationale des chartes" }]
dependencies = [
    "click",
    "elasticsearch>=8,<9",
    "Flask",
    "httpx",
    "lxml",
    "requests",
    "PyYAML",
    "pydantic>=2,<3",
    "thunderdots>=0.1.dev,<0.2",
]

[project.optional-dependencies]
dev = [
    "build",
    "pip-tools",
    "pytest",
    "wheel",
]

[project.scripts]
dots-es-cli = "dots_es.cli:main"
dots-api = "dots_es.flask_app:main"

[tool.setuptools]
packages = ["dots_es", "dots_es.api"]

[tool.setuptools.dynamic]
version = { attr = "dots_es.__version__" }

[tool.setuptools.package-data]
dots_es = ["config/*.yml", "elasticsearch/*.json"]
